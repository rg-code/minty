services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: aggregator
      POSTGRES_USER: aggregator
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [agg-db:/var/lib/postgresql/data]
    networks: [agg]
    restart: unless-stopped

  api:                      # holds Plaid secrets; serves dashboard + endpoints; runs sync in-process
    build: .
    env_file: .env
    depends_on: [db]
    networks: [agg]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"   # localhost only — expose to your tailnet via Tailscale Serve

# No 'sync' container: syncing runs on a background thread inside the api process,
# so there is no /internal/sync HTTP endpoint to expose. Manual pull, if ever needed:
#   docker compose exec api python -m app.sync_cli

volumes:
  agg-db:
networks:
  agg:
