<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ABC · Minty</title>
<script>
  // Same theme preference as the dashboard, applied before first paint.
  document.documentElement.dataset.theme = localStorage.getItem("minty-theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
<style>
  :root { color-scheme:light; --bg:#f6f7f9; --surface:#fff; --ink:#16181d; --muted:#6b7280; --hairline:#e7e9ee;
          --accent:#4c6ef5; --ok:#0ca678; --ok-bg:#e6f7f1; --warn:#b08900; --warn-bg:#fff8e6; --err:#e03131; --err-bg:#fff1f1;
          --track:#e7e9ee; --shadow:rgba(0,0,0,.05); --radius:10px; --pad:clamp(16px, 3vw, 28px); }
  :root[data-theme="dark"] { color-scheme:dark; --bg:#0f1115; --surface:#171a21; --ink:#e6e8ee; --muted:#9aa3b2;
          --hairline:#272c37; --accent:#748ffc; --ok:#20c997; --ok-bg:#12291f; --warn:#f2c94c; --warn-bg:#2a2412;
          --err:#ff6b6b; --err-bg:#2c1517; --track:#272c37; --shadow:rgba(0,0,0,.4); }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:980px; margin:0 auto; padding:20px var(--pad) 48px; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header h1 { font-size:22px; margin:0; letter-spacing:-0.01em; }
  header .sub { color:var(--muted); font-size:13.5px; flex:1 1 260px; }
  a.back { color:var(--muted); font-size:13px; text-decoration:none; }
  a.back:hover { color:var(--ink); }
  select, button { font:inherit; color:var(--ink); }
  select { background:var(--surface); border:1px solid var(--hairline); border-radius:8px; padding:5px 8px; font-size:13px; }
  .themetoggle { border:1px solid var(--hairline); background:var(--surface); color:var(--muted); border-radius:8px; width:32px; height:32px;
                 display:grid; place-items:center; cursor:pointer; padding:0; }
  .themetoggle svg { width:16px; height:16px; }
  :root[data-theme="dark"] .themetoggle .moon, :root:not([data-theme="dark"]) .themetoggle .sun { display:none; }

  .tiles { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:10px; margin:18px 0 8px; }
  .tile { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius); padding:12px 14px; }
  .tile .k { font-size:12px; color:var(--muted); }
  .tile .v { font-size:21px; font-weight:650; font-variant-numeric:tabular-nums; margin-top:2px; }
  .tile.used .v { color:var(--ok); } .tile.open .v { color:var(--accent); } .tile.pending .v { color:var(--warn); } .tile.missed .v { color:var(--err); }
  .tile .of { font-size:12px; color:var(--muted); }
  @media (max-width: 640px) { .tiles { grid-template-columns:repeat(2, minmax(0, 1fr)); } }

  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:26px 0 8px; }
  .soon { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius); }
  .soon .row { display:flex; justify-content:space-between; gap:12px; padding:9px 14px; font-size:13.5px; }
  .soon .row + .row { border-top:1px solid var(--hairline); }
  .soon .when { color:var(--muted); white-space:nowrap; font-variant-numeric:tabular-nums; }

  section.card { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius); margin-top:14px; overflow:hidden; }
  .cardhead { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 14px; border-bottom:1px solid var(--hairline); }
  .cardhead .title { font-weight:650; overflow-wrap:anywhere; }
  .cardhead .meta { color:var(--muted); font-size:12.5px; flex:1 1 200px; }
  .cardhead .sum { font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .cardhead .tools { display:flex; gap:6px; flex-wrap:wrap; align-items:center; font-size:12.5px; color:var(--muted); }
  .linkbtn { background:none; border:0; color:var(--muted); cursor:pointer; font-size:12.5px; text-decoration:underline; padding:0; }
  .linkbtn:hover { color:var(--ink); }

  .ben { display:grid; grid-template-columns:minmax(0, 1.4fr) minmax(0, 1fr); gap:6px 16px; padding:11px 14px; align-items:center; }
  .ben + .ben { border-top:1px solid var(--hairline); }
  .ben .name { font-weight:550; overflow-wrap:anywhere; }
  .ben .note { color:var(--muted); font-size:12.5px; overflow-wrap:anywhere; }
  .ben .note a { color:inherit; }
  .chip { display:inline-block; font-size:11px; font-weight:600; border-radius:999px; padding:1px 7px; margin-left:6px; vertical-align:1px;
          background:var(--track); color:var(--muted); white-space:nowrap; }
  .chip.warn { background:var(--warn-bg); color:var(--warn); }
  .now { font-size:13px; font-variant-numeric:tabular-nums; }
  .now .st { font-weight:600; }
  .st.used { color:var(--ok); } .st.partial, .st.pending { color:var(--warn); } .st.missed { color:var(--err); }
  .st.open { color:var(--accent); } .st.locked, .st.upcoming { color:var(--muted); }
  .bar { height:6px; background:var(--track); border-radius:999px; overflow:hidden; margin:5px 0 6px; }
  .bar span { display:block; height:100%; background:var(--ok); border-radius:999px; }
  .squares { display:flex; gap:3px; flex-wrap:wrap; }
  .sq { width:16px; height:16px; border-radius:4px; border:1px solid var(--hairline); background:var(--surface); padding:0; }
  .sq.used { background:var(--ok); border-color:var(--ok); }
  .sq.partial, .sq.pending { background:var(--warn-bg); border-color:var(--warn); }
  .sq.missed { background:var(--err-bg); border-color:var(--err); }
  .sq.open { border-color:var(--accent); border-width:2px; }
  .sq.upcoming, .sq.locked { opacity:.5; }
  .sq.out { opacity:.35; }                               /* belongs to another year's totals */
  button.sq { cursor:pointer; }
  button.sq:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  @media (max-width: 640px) { .ben { grid-template-columns:minmax(0, 1fr); } }

  .others { background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius); }
  .others .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 14px; font-size:13.5px; flex-wrap:wrap; }
  .others .row + .row { border-top:1px solid var(--hairline); }
  .foot { color:var(--muted); font-size:12.5px; margin-top:26px; }
  .foot ul { margin:6px 0 0; padding-left:18px; }
  .msg { color:var(--muted); padding:30px 0; text-align:center; }
  .err { color:var(--err); }
  .legend { display:flex; gap:12px; flex-wrap:wrap; color:var(--muted); font-size:12px; margin-top:8px; align-items:center; }
  .legend .sq { width:12px; height:12px; display:inline-block; vertical-align:-2px; margin-right:4px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="/">← Minty</a>
    <h1>ABC</h1>
    <span class="sub">All but coupon clipping: every credit on your cards, used and still open.</span>
    <select id="year" aria-label="Year"></select>
    <button class="themetoggle" id="themeToggle" type="button">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <main id="main"><div class="msg">Loading…</div></main>
</div>

<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = c => "$" + (c / 100).toLocaleString("en-US", { minimumFractionDigits: c % 100 ? 2 : 0, maximumFractionDigits: 2 });
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const day = d => `${MON[Number(d.slice(5, 7)) - 1]} ${Number(d.slice(8, 10))}`;
const dayYear = d => `${day(d)}, ${d.slice(0, 4)}`;
const PERIOD = { monthly: "each month", quarterly: "each quarter", semiannual: "each half-year", annual: "each year", every_4_years: "every 4 years" };
const STATUS = { used: "Used", partial: "Partly used", pending: "Charged, credit pending", locked: "Not unlocked yet",
                 open: "Open", missed: "Missed", upcoming: "Not started" };
let USERS = [];
let data = null;
let year = Number(new URLSearchParams(location.search).get("year")) || null;
let showHidden = false;

async function load() {
  const main = document.getElementById("main");
  try {
    const [u, r] = await Promise.all([fetch("/users"), fetch("/benefits" + (year ? `?year=${year}` : ""))]);
    if (u.ok) USERS = await u.json();
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.status);
    data = await r.json();
  } catch (e) {
    main.innerHTML = `<div class="msg err">Couldn't load your credits: ${esc(e.message)}</div>`;
    return;
  }
  year = data.year;
  const ys = document.getElementById("year");
  const thisYear = Number(data.today.slice(0, 4));
  ys.innerHTML = [thisYear, thisYear - 1, thisYear - 2].map(y => `<option value="${y}" ${y === year ? "selected" : ""}>${y}</option>`).join("");
  render();
}

const who = c => USERS.length > 1 ? ` · ${esc(USERS.find(u => u.key === c.owner)?.label ?? c.owner)}` : "";
const cardTitle = c => `${esc(c.name || "Card")}${c.mask ? ` ••${esc(c.mask)}` : ""}`;

function render() {
  const d = data, t = d.totals;
  const tracked = d.cards.filter(c => c.product && !c.hidden);
  const hidden = d.cards.filter(c => c.hidden);
  const others = d.cards.filter(c => !c.product && !c.hidden);
  const past = d.year < Number(d.today.slice(0, 4));
  let html = `
    <div class="tiles">
      <div class="tile used"><div class="k">Used in ${d.year}</div><div class="v">${money(t.used_cents)}</div><div class="of">of ${money(t.available_cents)} available</div></div>
      <div class="tile open"><div class="k">${past ? "Left open" : "Open now"}</div><div class="v">${money(t.open_now_cents)}</div><div class="of">in current periods</div></div>
      <div class="tile pending"><div class="k">Credit pending</div><div class="v">${money(t.pending_cents)}</div><div class="of">charged, not credited yet</div></div>
      <div class="tile missed"><div class="k">Missed</div><div class="v">${money(t.missed_cents)}</div><div class="of">in periods that ended</div></div>
    </div>
    <div class="legend">
      <span><span class="sq used"></span>used</span><span><span class="sq partial"></span>partly / pending</span>
      <span><span class="sq missed"></span>missed</span><span><span class="sq open"></span>open now</span><span><span class="sq upcoming"></span>not started</span>
    </div>`;

  const soon = d.ending_soon.slice(0, 8);
  if (soon.length && !past) {
    html += `<h2>Use before it resets</h2><div class="soon">` + soon.map(e => `<div class="row">
      <span>${money(e.left_cents)} · ${esc(e.benefit)} <span class="note" style="color:var(--muted)">(${esc(e.card || "card")}${e.mask ? " ••" + esc(e.mask) : ""})</span></span>
      <span class="when">by ${day(e.ends)}</span></div>`).join("") + `</div>`;
  }

  if (!tracked.length) html += `<div class="msg">None of your cards has credits Minty tracks yet. If one does, pick it under “Other cards” below.</div>`;
  for (const c of tracked) html += cardHTML(c);

  if (others.length) {
    html += `<h2>Other cards</h2><div class="others">` + others.map(c => `<div class="row">
      <span>${cardTitle(c)} <span style="color:var(--muted)">· ${esc(c.bank || "")}${who(c)}</span></span>
      <span><select data-product="${c.account_id}" aria-label="Which card is this?">
        <option value="">No tracked credits</option>
        ${d.products.map(p => `<option value="${esc(p.id)}">It's a ${esc(p.name)}</option>`).join("")}
      </select> <button class="linkbtn" data-hide="${c.account_id}">Hide</button></span></div>`).join("") + `</div>`;
  }
  if (hidden.length) {
    html += `<h2>Hidden cards</h2><div class="others">` + hidden.map(c => `<div class="row">
      <span>${cardTitle(c)} <span style="color:var(--muted)">· ${esc(c.bank || "")}</span></span>
      <button class="linkbtn" data-unhide="${c.account_id}">Show again</button></div>`).join("") + `</div>`;
  }

  html += `<div class="foot">Benefit details checked ${esc(d.checked)} (Frequent Miler, Doctor of Credit, issuers' pages); each credit's ⓘ links to its source.
    Credits count in the period of the purchase they paid back. Not tracked:<ul>${d.not_tracked.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>`;
  document.getElementById("main").innerHTML = html;
}

function cardHTML(c) {
  const t = c.totals;
  const productPicker = `<select data-product="${c.account_id}" aria-label="Card product">
      <option value="auto" ${c.product_source !== "chosen" ? "selected" : ""}>${c.product_source === "chosen" ? "Recognise automatically" : esc(c.product.name) + " (recognised)"}</option>
      ${data.products.map(p => `<option value="${esc(p.id)}" ${c.product_source === "chosen" && c.product.id === p.id ? "selected" : ""}>${esc(p.name)}</option>`).join("")}
      <option value="none">No tracked credits</option></select>`;
  const yearPicker = c.card_year ? `<label>Card year starts <select data-month="${c.account_id}" aria-label="Card year starts">
      ${MON.map((m, i) => `<option value="${i + 1}" ${c.card_year.month === i + 1 ? "selected" : ""}>${m}</option>`).join("")}</select></label>
      ${c.card_year.source === "annual_fee" ? `<span title="From the first annual fee on the card">(from the annual fee)</span>` : ""}` : "";
  return `<section class="card">
    <div class="cardhead">
      <span class="title">${cardTitle(c)}</span>
      <span class="meta">${esc(c.product.name)} · ${esc(c.bank || "")}${who(c)} · ${money(c.product.fee_cents)} fee</span>
      <span class="sum">${money(t.used_cents)} of ${money(t.available_cents)} used${t.open_now_cents ? ` · ${money(t.open_now_cents)} open` : ""}</span>
      <span class="tools">${productPicker} ${yearPicker} <button class="linkbtn" data-hide="${c.account_id}">Hide</button></span>
    </div>
    ${c.benefits.map(b => benefitHTML(c, b)).join("")}
  </section>`;
}

function benefitHTML(c, b) {
  const chips = (b.enroll ? `<span class="chip warn" title="Enroll in the issuer's app or site, or the credit never posts">enroll</span>` : "")
    + (b.how === "outside" ? `<span class="chip" title="Minty can't see this one on a statement: tick it when you've used it">tick when used</span>` : "");
  const label = !b.label_seen && b.how === "on_card" ? " The statement wording is a best guess until one posts." : "";
  const left = `<div><div class="name">${esc(b.name)} · ${money(b.amount_cents)} ${PERIOD[b.period]}${chips}</div>
    <div class="note">${esc(b.note)}${esc(label)} <a href="${esc(b.source)}" target="_blank" rel="noopener" title="Source">ⓘ</a></div></div>`;

  if (b.once) {
    const o = b.once;
    const text = o.status === "used" ? `<span class="st used">Used</span> ${dayYear(o.last_used)} · next from ${dayYear(o.next_from)}`
      : o.last_used ? `<span class="st open">Available again</span> since ${dayYear(o.next_from)}`
      : `<span class="st open">No credit seen</span>${o.data_since ? ` since ${dayYear(o.data_since)} (Minty's history for this card)` : ""}`;
    return `<div class="ben">${left}<div class="now">${text}</div></div>`;
  }

  const p = b.current;
  let now = "";
  if (p) {
    const pct = Math.min(100, Math.round(100 * p.used_cents / p.cap_cents));
    now = `<span class="st ${p.status}">${STATUS[p.status]}</span> · ${money(p.used_cents)} of ${money(p.cap_cents)} · ${p.label}, ends ${day(p.end)}`;
    if (p.pending_cents) now += ` · ${money(p.pending_cents)} charged, waiting for the credit`;
    if (b.unlock && p.status === "locked") now += ` · spent ${money(b.unlock.spent_cents)} of ${money(b.unlock.needed_cents)} needed`;
    now += `<div class="bar"><span style="width:${pct}%"></span></div>`;
  } else {
    now = `<span class="st upcoming">No period this year</span>`;
  }
  const unpaid = b.periods.filter(x => x.status === "missed" && x.unpaid_cents);
  if (unpaid.length) now += `<div class="note err">Charged in ${unpaid.length} period${unpaid.length > 1 ? "s" : ""} with no credit back (${unpaid.map(x => x.label).join(", ")}): is it enrolled?</div>`;

  const squares = b.periods.map(x => {
    const title = `${x.label}: ${STATUS[x.status]}, ${money(x.used_cents)} of ${money(x.cap_cents)}` +
      (x.unpaid_cents ? `, ${money(x.unpaid_cents)} charged with no credit` : "") + (x.in_year ? "" : ` (counted in ${x.start.slice(0, 4)})`);
    const cls = `sq ${x.status}${x.in_year ? "" : " out"}`;
    if (b.how === "outside" && x.status !== "upcoming") {
      return `<button type="button" class="${cls}" role="checkbox" aria-checked="${!!x.marked}" title="${esc(title)} — click to ${x.marked ? "untick" : "tick as used"}"
        data-mark="${c.account_id}|${esc(b.id)}|${x.start}|${x.marked ? 0 : 1}"></button>`;
    }
    return `<span class="${cls}" title="${esc(title)}"></span>`;
  }).join("");
  return `<div class="ben">${left}<div><div class="now">${now}</div><div class="squares" aria-label="${esc(b.name)} by period">${squares}</div></div></div>`;
}

async function put(path, body) {
  const r = await fetch(path, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) { alert("Couldn't save: " + ((await r.json().catch(() => ({}))).detail || r.status)); return false; }
  return true;
}

document.getElementById("main").addEventListener("change", async e => {
  const s = e.target;
  if (s.dataset.product) {
    const v = s.value;
    // "auto" / "" = recognise automatically (null); "none" = no tracked credits; else a product id
    if (await put(`/benefits/cards/${s.dataset.product}`, { product_id: v === "auto" || v === "" ? null : v })) load();
  } else if (s.dataset.month) {
    if (await put(`/benefits/cards/${s.dataset.month}`, { anniversary_month: Number(s.value) })) load();
  }
});
document.getElementById("main").addEventListener("click", async e => {
  const b = e.target.closest("[data-mark],[data-hide],[data-unhide]");
  if (!b) return;
  if (b.dataset.mark) {
    const [account_id, benefit_id, period_start, used] = b.dataset.mark.split("|");
    b.disabled = true;
    if (await put("/benefits/marks", { account_id: Number(account_id), benefit_id, period_start, used: used === "1" })) load();
    else b.disabled = false;
  } else if (b.dataset.hide) {
    if (await put(`/benefits/cards/${b.dataset.hide}`, { hidden: true })) load();
  } else if (b.dataset.unhide) {
    if (await put(`/benefits/cards/${b.dataset.unhide}`, { hidden: false })) load();
  }
});
document.getElementById("year").addEventListener("change", e => {
  year = Number(e.target.value);
  history.replaceState(null, "", `?year=${year}`);
  load();
});

// Light/dark toggle (shares the "minty-theme" preference with the dashboard).
(function themeToggle() {
  const root = document.documentElement, btn = document.getElementById("themeToggle");
  const apply = t => {
    root.dataset.theme = t;
    const label = t === "dark" ? "Switch to light mode" : "Switch to dark mode";
    btn.setAttribute("aria-label", label); btn.title = label;
  };
  apply(root.dataset.theme);
  btn.addEventListener("click", () => {
    const t = root.dataset.theme === "dark" ? "light" : "dark";
    localStorage.setItem("minty-theme", t); apply(t);
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
    if (!localStorage.getItem("minty-theme")) apply(e.matches ? "dark" : "light");
  });
})();

load();
</script>
</body>
</html>
