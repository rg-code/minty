<!-- Kos (docs/trips.md): the household's trips, as an app of its own, served by Minty's Worker with
     Minty's sign-in and data. Flights, the theme and the map look like Flighty; trips like Wanderlog. -->
<header class="bar">
  <a class="brand" href="#/"><img src="/kos/icon-64.png" alt="" width="28" height="28" /><span>Kos</span></a>
  <nav class="bar-actions">
    <button type="button" class="icon-btn mail-check" id="gmailBtn" title="Check Gmail for bookings" aria-label="Check Gmail for bookings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/><path d="M8 10.5h5M10.5 8v5" class="mail-check-plus"/></svg></button>
    <button type="button" class="icon-btn" id="themeBtn" aria-label="Light or dark" title="Light or dark"><svg class="win" viewBox="0 0 24 24" aria-hidden="true"><defs><clipPath id="winPane"><rect x="7.5" y="5" width="9" height="14" rx="4.5" /></clipPath></defs><rect class="win-frame" x="5" y="2.5" width="14" height="19" rx="7" /><g clip-path="url(#winPane)"><rect class="win-sky" x="7.5" y="5" width="9" height="14" /><rect class="win-shade" x="7.5" y="-9" width="9" height="14" /></g><rect class="win-pane" x="7.5" y="5" width="9" height="14" rx="4.5" /></svg></button>
    <a class="icon-btn" href="#/data" title="Your data: export and import" aria-label="Your data"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z"/><path d="M4 7v10c0 1.7 3.6 3 8 3s8-1.3 8-3V7"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg></a>
    <a class="icon-btn" id="mintyLink" href="/" title="Open Minty" aria-label="Open Minty"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg></a>
  </nav>
