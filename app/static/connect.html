<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Connect an account</title>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
<script>
  // Same theme preference as the dashboard, applied before first paint.
  document.documentElement.dataset.theme = localStorage.getItem("minty-theme")
    || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
<style>
  :root { color-scheme:light; --bg:#f6f7f9; --surface:#fff; --ink:#16181d; --muted:#6b7280; --hairline:#e7e9ee;
          --accent:#4c6ef5; --ok:#0ca678; --err:#e03131; --pressed:#f0f2f7; --track:#e7e9ee;
          --u0:#4c6ef5; --u1:#0ca678; --u2:#e8590c; --u3:#ae3ec9; --u4:#1098ad; --u5:#d6336c;
          --btn-bg:#16181d; --btn-ink:#fff; --shadow:rgba(0,0,0,.05); --radius:10px; }
  :root[data-theme="dark"] { color-scheme:dark; --bg:#0f1115; --surface:#171a21; --ink:#e6e8ee; --muted:#9aa3b2;
          --hairline:#272c37; --accent:#748ffc; --ok:#20c997; --err:#ff6b6b; --pressed:#222836; --track:#272c37;
          --u0:#748ffc; --u1:#20c997; --u2:#ff922b; --u3:#da77f2; --u4:#3bc9db; --u5:#f06595;
          --btn-bg:#e6e8ee; --btn-ink:#0f1115; --shadow:rgba(0,0,0,.4); }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .card { position:relative; background:var(--surface); border:1px solid var(--hairline); border-radius:14px; padding:28px;
          width:min(440px,92vw); box-shadow:0 1px 3px var(--shadow); }
  .themetoggle { position:absolute; top:14px; right:14px; border:1px solid var(--hairline); background:var(--surface);
                 color:var(--muted); border-radius:8px; width:32px; height:32px; display:grid; place-items:center;
                 cursor:pointer; padding:0; }
  .themetoggle:hover { color:var(--ink); }
  .themetoggle svg { width:16px; height:16px; }
  :root[data-theme="dark"] .themetoggle .moon, :root:not([data-theme="dark"]) .themetoggle .sun { display:none; }
  h1 { font-size:19px; margin:0 0 4px; letter-spacing:-0.01em; }
  p.sub { color:var(--muted); font-size:13.5px; margin:0 0 22px; }
  .who { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; }
  .owners { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .owner { flex:1 1 30%; cursor:pointer; border:1px solid var(--hairline); border-radius:var(--radius);
           padding:12px; background:var(--surface); color:var(--ink); font:inherit; font-weight:550; display:flex; align-items:center;
           justify-content:center; gap:8px; transition:border-color .12s, background .12s; }
  .owner .dot { width:9px; height:9px; border-radius:50%; }
  .owner[aria-pressed="true"] { border-color:var(--ink); background:var(--pressed); }

  .cap { font-size:12.5px; color:var(--muted); background:var(--bg); border:1px solid var(--hairline);
         border-radius:var(--radius); padding:10px 12px; margin-bottom:18px; }
  .cap .line { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .cap .line + .line { margin-top:6px; }
  .cap .bar { flex:1; height:6px; border-radius:3px; background:var(--track); overflow:hidden; }
  .cap .fill { height:100%; background:var(--c, var(--accent)); }
  .cap b { color:var(--ink); font-variant-numeric:tabular-nums; }
  .cap .active { color:var(--ink); font-weight:600; }

  button.connect { width:100%; padding:13px; border:0; border-radius:var(--radius); cursor:pointer;
    font:inherit; font-weight:600; color:var(--btn-ink); background:var(--btn-bg); }
  button.connect:disabled { opacity:.45; cursor:not-allowed; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .status { margin-top:16px; font-size:13.5px; color:var(--muted); min-height:1.2em; text-align:center; }
  .status.ok { color:var(--ok); } .status.err { color:var(--err); }
  .status a { color:inherit; }
  .reconnect { border:1px solid var(--err); border-radius:var(--radius); padding:10px 12px; margin-bottom:18px; font-size:13px; }
  .reconnect .title { font-weight:600; color:var(--err); margin-bottom:6px; }
  .reconnect .line { display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .reconnect .line + .line { margin-top:6px; }
  .reconnect button { font:inherit; font-size:12.5px; font-weight:600; padding:5px 10px; border-radius:8px; cursor:pointer;
                      border:1px solid var(--hairline); background:var(--surface); color:var(--ink); }
  .reconnect button:disabled { opacity:.45; cursor:not-allowed; }
  a.back { display:block; text-align:center; margin-top:18px; font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<div class="card">
  <button class="themetoggle" id="themeToggle" type="button">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <h1>Connect an account</h1>
  <p class="sub">Link a bank or card. You log in through the bank directly — credentials never touch this server.</p>

  <div class="who">Whose account?</div>
  <div class="owners" id="owners" role="group" aria-label="Account owner"></div>

  <div class="cap" id="cap" hidden></div>
  <div class="reconnect" id="reconnect" hidden></div>

  <button class="connect" id="connect">Connect with Plaid</button>
  <div class="status" id="status"></div>
  <a class="back" href="/">← Back to Minty</a>
</div>

<script>
let USERS = [];                    // from /users, in MINTY_USERS order (sets each person's colour)
let owner = null;
let capacity = null;
const statusEl = document.getElementById("status");
const connectBtn = document.getElementById("connect");

function setStatus(msg, kind="") { statusEl.textContent = msg; statusEl.className = "status " + kind; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const colorOf = k => { const i = USERS.findIndex(u => u.key === k); return i < 0 ? "var(--accent)" : `var(--u${i % 6})`; };

async function loadUsers() {
  try { const r = await fetch("/users"); if (r.ok) USERS = await r.json(); } catch {}
  owner = USERS[0]?.key ?? null;
  renderOwners();
}

function renderOwners() {
  document.getElementById("owners").innerHTML = USERS.map(u =>
    `<button class="owner" data-owner="${esc(u.key)}" aria-pressed="${u.key === owner}">` +
    `<span class="dot" style="background:${colorOf(u.key)}"></span>${esc(u.label)}</button>`).join("");
  // Can't link for someone whose Plaid keys aren't in .env yet — say so instead of failing at Plaid.
  const u = USERS.find(x => x.key === owner);
  const ready = !!u && u.slots.some(s => s.configured);
  connectBtn.disabled = !ready;
  if (u && !ready) {
    statusEl.className = "status err";
    statusEl.innerHTML = `Plaid keys for ${esc(u.label)} aren't set yet. See <a href="/add-user">Add user</a>.`;
  } else if (statusEl.querySelector("a[href='/add-user']")) {
    setStatus("");
  }
}

document.getElementById("owners").addEventListener("click", e => {
  const b = e.target.closest(".owner");
  if (!b) return;
  owner = b.dataset.owner;
  renderOwners(); renderCapacity();
});

// Banks that need you to sign in again (status login_required): repair them with Link update mode.
async function loadReconnect() {
  const box = document.getElementById("reconnect");
  let items = [];
  try { const r = await fetch("/items"); if (r.ok) items = (await r.json()).filter(i => i.status === "login_required"); } catch {}
  box.hidden = !items.length;
  const label = k => USERS.find(u => u.key === k)?.label ?? k;
  box.innerHTML = items.length ? `<div class="title">Needs you to sign in again</div>` + items.map(i =>
    `<div class="line"><span>${esc(i.institution_name || "Bank")} · ${esc(label(i.owner))}</span>` +
    `<button type="button" data-reconnect="${i.id}">Reconnect</button></div>`).join("") : "";
}

document.getElementById("reconnect").addEventListener("click", async e => {
  const b = e.target.closest("button[data-reconnect]");
  if (!b) return;
  b.disabled = true;
  setStatus("Preparing…");
  try {
    const itemId = Number(b.dataset.reconnect);
    const res = await fetch("/link/token/update", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ item_id: itemId }),
    });
    if (!res.ok) throw new Error(await res.text());
    const { link_token, plaid_account } = await res.json();
    localStorage.setItem("plaid_link_token", link_token);
    localStorage.setItem("plaid_link_account", plaid_account);
    localStorage.setItem("plaid_link_update_item", String(itemId));
    localStorage.removeItem("plaid_link_owner");
    openLink(link_token, null, plaid_account, null, itemId);
  } catch (err) {
    setStatus("Couldn't start reconnect: " + err.message, "err");
    b.disabled = false;
  }
});

async function loadCapacity() {
  try {
    const r = await fetch("/capacity");
    if (r.ok) { capacity = await r.json(); renderCapacity(); }
  } catch {}
}

function renderCapacity() {
  const box = document.getElementById("cap");
  if (!capacity || !capacity[owner]) { box.hidden = true; return; }
  const slots = capacity[owner];
  // the "active" account is the first one under cap (matches server overflow logic)
  const active = slots.find(s => s.used < s.cap);
  box.hidden = false;
  box.style.setProperty("--c", colorOf(owner));
  box.innerHTML = slots.map(s => {
    const pct = Math.min(100, Math.round((s.used / s.cap) * 100));
    const isActive = active && s.account === active.account;
    return `<div class="line">
      <span class="${isActive ? "active" : ""}">${s.slot}${isActive ? " · next link" : ""}</span>
      <span class="bar"><span class="fill" style="width:${pct}%"></span></span>
      <b>${s.used}/${s.cap}</b>
    </div>`;
  }).join("") + (active ? "" : `<div class="line" style="color:var(--err);margin-top:8px">Both trials full — add an overflow account or upgrade Plaid.</div>`);
}

// OAuth return: resume with the SAME link_token + plaid_account saved pre-redirect.
const params = new URLSearchParams(window.location.search);
if (params.get("oauth_state_id")) {
  const savedToken = localStorage.getItem("plaid_link_token");
  const savedOwner = localStorage.getItem("plaid_link_owner");
  const savedAccount = localStorage.getItem("plaid_link_account");
  const savedUpdateItem = localStorage.getItem("plaid_link_update_item");
  if (savedToken && savedAccount && savedUpdateItem) {
    openLink(savedToken, null, savedAccount, window.location.href, Number(savedUpdateItem));
  } else if (savedToken && savedOwner && savedAccount) {
    openLink(savedToken, savedOwner, savedAccount, window.location.href);
  } else {
    setStatus("Could not resume the connection. Please start again.", "err");
  }
}

connectBtn.addEventListener("click", async () => {
  connectBtn.disabled = true;
  setStatus("Preparing…");
  try {
    const res = await fetch("/link/token", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ owner }),
    });
    if (!res.ok) throw new Error(await res.text());
    const { link_token, plaid_account } = await res.json();

    // persist across a possible OAuth redirect
    localStorage.setItem("plaid_link_token", link_token);
    localStorage.setItem("plaid_link_owner", owner);
    localStorage.setItem("plaid_link_account", plaid_account);
    localStorage.removeItem("plaid_link_update_item");

    openLink(link_token, owner, plaid_account, null);
  } catch (e) {
    setStatus("Couldn't start Link: " + e.message, "err");
    connectBtn.disabled = false;
  }
});

const LINK_KEYS = ["plaid_link_token", "plaid_link_owner", "plaid_link_account", "plaid_link_update_item"];

// updateItemId set = update mode (reconnect): Plaid repairs the existing Item; nothing to exchange.
function openLink(token, forOwner, plaidAccount, receivedRedirectUri, updateItemId = null) {
  const handler = Plaid.create({
    token,
    receivedRedirectUri,
    onSuccess: async (public_token, metadata) => {
      if (updateItemId !== null) {
        LINK_KEYS.forEach(k => localStorage.removeItem(k));
        setStatus("Reconnected. It will refresh on the next hourly sync.", "ok");
        loadReconnect();
        return;
      }
      setStatus("Linking and pulling transactions…");
      try {
        const res = await fetch("/link/exchange", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ owner: forOwner, plaid_account: plaidAccount, public_token,
                                 institution_name: metadata?.institution?.name ?? null }),
        });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        LINK_KEYS.forEach(k => localStorage.removeItem(k));
        setStatus(data.status === "good"
          ? "Connected. Transactions are syncing." : "Connected (status: " + data.status + ").", "ok");
        loadCapacity();
        connectBtn.disabled = false;
      } catch (e) {
        setStatus("Exchange failed: " + e.message, "err");
        connectBtn.disabled = false;
      }
    },
    onExit: (err) => {
      if (err) setStatus("Link closed: " + (err.error_message || err.error_code || "cancelled"), "err");
      else setStatus("");
      connectBtn.disabled = false;
      loadReconnect();
    },
  });
  handler.open();
}

// Light/dark toggle (shares the "minty-theme" preference with the dashboard).
(function themeToggle() {
  const root = document.documentElement, btn = document.getElementById("themeToggle");
  const apply = t => {
    root.dataset.theme = t;
    const label = t === "dark" ? "Switch to light mode" : "Switch to dark mode";
    btn.setAttribute("aria-label", label); btn.title = label;
  };
  apply(root.dataset.theme);
  btn.addEventListener("click", () => {
    const t = root.dataset.theme === "dark" ? "light" : "dark";
    localStorage.setItem("minty-theme", t); apply(t);
  });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
    if (!localStorage.getItem("minty-theme")) apply(e.matches ? "dark" : "light");
  });
})();

loadUsers().then(() => { loadCapacity(); loadReconnect(); });
</script>
</body>
</html>
